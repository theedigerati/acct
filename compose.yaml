services:
  dnsmasq:
    image: jpillora/dnsmasq
    ports:
      - "53:53/udp"
      - "5380:8080"
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf
    networks:
      - acct-backend
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    environment:
      - HTTP_USER=acct
      - HTTP_PASS=acct
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    networks:
      - acct-backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
    restart: unless-stopped
  db:
    networks:
      - acct-backend
    image: postgres
    restart: unless-stopped
    volumes:
      - db:/var/lib/postgresql/data
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=acct
      - POSTGRES_PASSWORD=acct

  api:
    networks:
      - acct-backend
    build: .
    ports:
      - "8000:8000"
    container_name: api
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: .
          target: /app
    env_file:
      - ./.env
    depends_on:
      - db

  celery:
    networks:
      - acct-backend
    build: .
    command: celery --app=core worker --loglevel=info
    restart: unless-stopped
    volumes:
      - celery:/data
    env_file:
      - ./.env
    environment:
      - CELERY_BROKER=${REDIS_URL:?}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:?}
    depends_on:
      - redis

  redis:
    networks:
      - acct-backend
    image: redis
    restart: unless-stopped

volumes:
  db:
  celery:

networks:
  acct-backend:
    driver: bridge
